  What is Acme Cloud's return policy for opened electronics?
expected: |
  Opened electronics can be returned within 14 days of purchase for store credit
  only, provided all accessories and original packaging are included. Acme Cloud
  does not issue cash refunds on opened electronics.
metadata:
