[project]
name = "ai-eval"
version = "0.1.0"
description = "Run repeatable LLM evaluations in local Arize Phoenix against your own prompts and ground-truth answers."
requires-python = ">=3.10,<3.13"
dependencies = [
    "arize-phoenix>=8.0.0",
    "arize-phoenix-client>=1.0.0",
    "arize-phoenix-evals>=2.0.0",
    "litellm>=1.55.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
