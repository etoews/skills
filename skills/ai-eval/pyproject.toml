[project]
name = "ai-eval"
version = "0.1.0"
description = "Run repeatable LLM evaluations in local Arize Phoenix against your own prompts and ground-truth answers."
requires-python = ">=3.10,<3.13"
dependencies = [
    "arize-phoenix>=8.0.0",
    "arize-phoenix-client>=1.0.0",
    "arize-phoenix-evals>=2.0.0",
    "arize-phoenix-otel>=0.9.0",
    "openinference-instrumentation-litellm>=0.1.20",
    "litellm>=1.55.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.22",
    "ty>=0.0.60",
]

[tool.ruff]
# config, dataset, model, evaluators live in scripts/; tests import them.
# Tell isort they are first-party so imports group correctly.
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]  # pytest uses asserts; tests need no docstrings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# Put scripts/ on sys.path so tests `import config` etc. without a path shim.
pythonpath = ["scripts"]

[tool.ty.environment]
# Resolve the flat scripts/ modules as first-party (config, dataset, ...).
root = ["scripts"]
